name: Update data

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: rwa-data-pipeline

      - name: Check API keys
        id: keys
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          PORTALS_API_KEY: ${{ secrets.PORTALS_API_KEY }}
        run: |
          if [[ -z "$CMC_API_KEY" || -z "$PORTALS_API_KEY" ]]; then
            echo "::notice::Data update skipped: both CMC_API_KEY and PORTALS_API_KEY secrets are required."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh data
        if: steps.keys.outputs.ready == 'true'
        working-directory: rwa-data-pipeline
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          PORTALS_API_KEY: ${{ secrets.PORTALS_API_KEY }}
        run: |
          status=0
          uv run rwa-pipeline sync --refresh --format all || status=$?
          case "$status" in
            0) ;;
            2) echo "::notice::Partial refresh: previous snapshots were retained for assets that failed to update; some rights profiles may have been excluded." ;;
            *) exit "$status" ;;
          esac

      - run: uv run pytest -q -m "not shipped_data"
        if: steps.keys.outputs.ready == 'true'
        working-directory: rwa-data-pipeline

      - uses: pnpm/action-setup@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          package_json_file: rwa-interface/package.json
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rwa-interface/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.keys.outputs.ready == 'true'
        working-directory: rwa-interface
      - run: pnpm test
        if: steps.keys.outputs.ready == 'true'
        working-directory: rwa-interface
      - run: pnpm build
        if: steps.keys.outputs.ready == 'true'
        working-directory: rwa-interface
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.keys.outputs.ready == 'true'
        working-directory: rwa-interface
      - run: pnpm test:e2e
        if: steps.keys.outputs.ready == 'true'
        working-directory: rwa-interface

      - name: Set update date
        if: steps.keys.outputs.ready == 'true'
        id: date
        run: echo "version=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Commit and push changed data
        if: steps.keys.outputs.ready == 'true'
        id: push
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_DATE: ${{ steps.date.outputs.version }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "::warning::Default branch moved during the update. Nothing will be committed or published; the next run will refresh data using the new code."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -- rwa-data-pipeline/data rwa-interface/public ':!rwa-data-pipeline/data/raw' ':!rwa-data-pipeline/data/raw/**'
          if git diff --cached --quiet; then
            echo "::notice::No data changes to commit."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data: daily update $UPDATE_DATE"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub credentials
        if: steps.keys.outputs.ready == 'true' && steps.push.outputs.publish == 'true'
        id: docker
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::notice::Image publishing skipped: both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are required."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.docker.outputs.ready == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.docker.outputs.ready == 'true'
      - uses: docker/login-action@v3
        if: steps.docker.outputs.ready == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.docker.outputs.ready == 'true'
        with:
          context: rwa-interface
          platforms: linux/amd64,linux/arm64
          tags: |
            cp0x/pi-rwa-interface:${{ steps.date.outputs.version }}
            cp0x/pi-rwa-interface:latest
          push: true
