name: backend

on:
  push:
    branches: [v2.0]
    paths: ["rwa-backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [v2.0]
    paths: ["rwa-backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rwa-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: rwa-backend/go.mod
          cache-dependency-path: rwa-backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # built from source with the toolchain above: the release binaries of v2.5 are built with Go 1.25 and refuse
      # a module that targets Go 1.26 ("the Go language version used to build golangci-lint is lower")
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          install-mode: goinstall
          working-directory: rwa-backend
