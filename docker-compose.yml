# Whole project from prebuilt images: PostgreSQL -> migrate -> api + web + collector. Nothing is built here, so the
# same file runs on the server: `docker compose pull && docker compose up -d` (or `make deploy`).
# Images (pushed by rwa-backend/build.sh and rwa-interface/build.sh): cp0x/pi-rwa-backend, cp0x/pi-rwa-interface,
# tag RWA_VERSION from .env (default latest). Local build from this checkout: docker-compose.build.yml (`make up`).
# On an empty database the collector starts a live run at once (CMC + Portals, ~10-15 min), then repeats it every
# COLLECT_INTERVAL (24h). The site shows "no data yet" until the first run is published.
#   cp .env.example .env     # CMC_API_KEY, PORTALS_API_KEY, ADMIN_TOKEN; on a server also POSTGRES_PASSWORD, SITE_URL
#   open http://localhost:3301 (API on http://localhost:3302). Every port is published on 127.0.0.1 only: on a server
#   nginx in front sends /api/ and /logos/ to the API port and everything else to the site port.
name: rwa-explorer

# Built from POSTGRES_* (the defaults rwa/rwa/rwa are for local use only; set POSTGRES_PASSWORD on a server).
x-database-url: &database-url postgres://${POSTGRES_USER:-rwa}:${POSTGRES_PASSWORD:-rwa}@postgres:5432/${POSTGRES_DB:-rwa}?sslmode=disable

# Log rotation of every container: at most 3 files of 10 MB each (Docker keeps json-file logs forever by default).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# One image, several commands (the ENTRYPOINT is `rwa`).
x-backend: &backend
  image: cp0x/pi-rwa-backend:${RWA_VERSION:-latest}
  logging: *logging

services:
  postgres:
    image: postgres:16.10
    container_name: cp0x-pi-rwa-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rwa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rwa}
      POSTGRES_DB: ${POSTGRES_DB:-rwa}
    volumes:
      # Database files in a folder next to this file (git-ignored). Another folder: PGDATA_DIR in .env.
      # Delete the folder (make reset) to start from scratch: the next `up` migrates and collects again.
      - ${PGDATA_DIR:-./pg-data}:/var/lib/postgresql/data
    # Not published. To connect from the host (psql, a GUI) uncomment:
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies migrations and exits.
  migrate:
    <<: *backend
    container_name: cp0x-pi-rwa-backend-migrate
    command: ["migrate", "up"]
    restart: "no"
    environment:
      DATABASE_URL: *database-url
      LOG_FORMAT: text
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  collector:
    <<: *backend
    container_name: cp0x-pi-rwa-backend-collector
    command: ["collector"]
    restart: unless-stopped
    # The collector waits up to 30 s for a running job on SIGTERM, plus 5 s for the pool.
    stop_grace_period: 45s
    environment:
      DATABASE_URL: *database-url
      MIGRATE_ON_START: "false"
      CMC_API_KEY: ${CMC_API_KEY:?set it in .env}
      PORTALS_API_KEY: ${PORTALS_API_KEY:?set it in .env}
      # A live run starts right away when there is no successful run yet or the last one is older than the interval.
      # A live run costs about 22 CMC credits; set COLLECT_ON_START=false in .env to skip it.
      COLLECT_ON_START: ${COLLECT_ON_START:-true}
      COLLECT_INTERVAL: ${COLLECT_INTERVAL:-24h}
      LOG_FORMAT: text
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUN_EVENTS_LEVEL: debug   # new variable of the run journal; older builds ignore unknown variables
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true   # no HTTP server; the image HEALTHCHECK belongs to api

  api:
    <<: *backend
    container_name: cp0x-pi-rwa-backend-api
    command: ["api"]
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      HTTP_ADDR: ":8080"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${API_PORT:-3302}}   # shown in the startup banner only
      # Token of the admin endpoints (manual run request). Required: on a server /api/ is public, a known token would
      # let anyone start runs that spend CMC credits. `devtoken` from .env.example is for localhost only.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set it in .env}
      COLLECT_INTERVAL: ${COLLECT_INTERVAL:-24h}   # same as the collector: api computes next_run_at in /status from it
      LOG_FORMAT: text
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-3302}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      # /readyz is 503 until the first live run has published a build (~10-15 min on an empty database)
      start_period: 120s
      start_interval: 3s

  web:
    image: cp0x/pi-rwa-interface:${RWA_VERSION:-latest}
    container_name: cp0x-pi-rwa-interface
    restart: unless-stopped
    logging: *logging
    environment:
      API_URL: http://api:8080
      # public address of the site: canonical links, hreflang, sitemap.xml, robots.txt (https://rwa.cp0x.com on the server)
      SITE_URL: ${SITE_URL:-http://localhost:${WEB_PORT:-3301}}
      PORT: "4173"
    ports:
      - "127.0.0.1:${WEB_PORT:-3301}:4173"
    depends_on:
      api:
        condition: service_started

