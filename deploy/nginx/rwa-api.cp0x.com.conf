# rwa-api.cp0x.com: the public read API of RWA Explorer (container cp0x-pi-rwa-backend-api, 127.0.0.1:3303).
# Programs and AI agents are sent here (llms.txt, JSON-LD, <link rel="service-desc">, OpenAPI `servers`); the site
# rwa.cp0x.com keeps proxying /api/ and /logos/ to the same container for the browser (rwa.cp0x.com.conf.snippet).
#
# Install on the server, once:
#   1. DNS: an A (and AAAA) record rwa-api.cp0x.com -> this server, like rwa.cp0x.com
#   2. sudo cp deploy/nginx/rwa-api.cp0x.com.conf /etc/nginx/sites-available/
#      sudo ln -s /etc/nginx/sites-available/rwa-api.cp0x.com.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d rwa-api.cp0x.com      # adds the 443 server and the redirect from port 80
#   5. curl -s https://rwa-api.cp0x.com/api/v1/status
#      curl -s -o /dev/null -w '%{http_code}\n' -X POST https://rwa-api.cp0x.com/api/v1/admin/runs   # 404

server {
    listen 80;
    listen [::]:80;
    server_name rwa-api.cp0x.com;

    access_log /var/log/nginx/rwa-api.access.log;
    error_log /var/log/nginx/rwa-api.error.log;

    # Admin operations stay on the server (curl to 127.0.0.1:3303 with ADMIN_TOKEN): never public.
    location ^~ /api/v1/admin/ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:3303;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
        # A public read API: web apps on other sites may read it from the browser (no cookies, no credentials).
        # The API sends no CORS headers itself while CORS_ORIGINS is empty, so these are the only ones.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "ETag, X-Request-ID" always;
    }

    location /logos/ {
        proxy_pass http://127.0.0.1:3303;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # The bare domain shows what the API is; the map of the data for language models lives on the site.
    location = / { return 302 /api/v1/openapi.yaml; }
    location = /llms.txt { return 302 https://rwa.cp0x.com/llms.txt; }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /api/\nAllow: /logos/\nDisallow: /api/v1/admin/\n";
    }

    # /healthz and /readyz of the container stay internal (docker healthcheck, nginx of the site).
    location / { return 404; }
}
