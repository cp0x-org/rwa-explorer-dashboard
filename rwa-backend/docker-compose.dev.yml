# Development only: throwaway credentials, bound to localhost.
services:
  postgres:
    image: postgres:16.10
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: rwa
      POSTGRES_PASSWORD: rwa
      POSTGRES_DB: rwa
    volumes:
      - rwa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rwa -d rwa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rwa-pgdata:
