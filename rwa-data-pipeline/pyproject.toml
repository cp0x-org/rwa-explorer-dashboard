[project]
name = "rwa-pipeline"
version = "0.1.0"
description = "Collects tokenized RWA versions from CoinMarketCap and their DeFi usage from Portals, exports JSON for pi-rwa-interface"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
rwa-pipeline = "rwa_pipeline.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rwa_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
